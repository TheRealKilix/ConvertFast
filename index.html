<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO Meta Tags -->
    <title>ConvertiFast - Convertisseurs Universels Gratuits | Longueur, Poids, Temperature, Monnaie</title>
    <meta name="description" content="ConvertiFast: Plateforme gratuite de convertisseurs universels. Convertissez longueur, poids, temperature, volume, vitesse, temps, stockage informatique, monnaies, tailles vetements et chaussures. Rapide et precis." />
    <meta name="keywords" content="convertisseur, conversion, longueur, poids, temperature, volume, vitesse, temps, monnaie, taille vetements, taille chaussures, gratuit" />
    <meta name="author" content="ConvertiFast" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://convertifast.com/" />

    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="ConvertiFast - Convertisseurs Universels Gratuits" />
    <meta property="og:description" content="Plateforme gratuite de convertisseurs universels. Convertissez tout: longueur, poids, temperature, monnaie et plus encore." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://convertifast.com/" />
    <meta property="og:image" content="https://convertifast.com/og-image.png" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:site_name" content="ConvertiFast" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ConvertiFast - Convertisseurs Universels Gratuits" />
    <meta name="twitter:description" content="Convertissez tout instantanement: longueur, poids, temperature, monnaie et plus encore." />
    <meta name="twitter:image" content="https://convertifast.com/og-image.png" />

    <!-- Theme Color for Mobile Browsers -->
    <meta name="theme-color" content="#0f172a" />
    <meta name="msapplication-navbutton-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-status-bar-style" content="#0f172a" />

    <!-- Critical CSS for initial render (prevents flash of unstyled content) -->
    <style>
      /* Critical styles for loading screen */
      html, body {
        margin: 0;
        padding: 0;
        background: #020617;
        color: #f8fafc;
        font-family: Inter, system-ui, -apple-system, sans-serif;
        min-height: 100vh;
      }

      #root {
        min-height: 100vh;
      }

      /* Loading screen styles */
      .loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: linear-gradient(135deg, #020617 0%, #0f172a 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.3s ease-out;
      }

      .loading-screen.hidden {
        opacity: 0;
        pointer-events: none;
      }

      .loading-logo {
        width: 80px;
        height: 80px;
        border-radius: 20px;
        background: linear-gradient(135deg, #6366f1 0%, #14b8a6 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        animation: pulse 2s infinite;
        box-shadow: 0 0 40px rgba(99, 102, 241, 0.3);
      }

      .loading-logo svg {
        width: 48px;
        height: 48px;
        color: white;
      }

      .loading-text {
        margin-top: 24px;
        font-size: 18px;
        font-weight: 600;
        color: #94a3b8;
      }

      .loading-spinner {
        margin-top: 16px;
        width: 32px;
        height: 32px;
        border: 3px solid #334155;
        border-top-color: #6366f1;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
      }

      /* Error screen styles */
      .error-screen {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: #020617;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
        z-index: 10000;
      }

      .error-screen.visible {
        display: flex;
      }

      .error-icon {
        width: 64px;
        height: 64px;
        color: #ef4444;
        margin-bottom: 16px;
      }

      .error-title {
        font-size: 24px;
        font-weight: 700;
        color: #f8fafc;
        margin-bottom: 8px;
      }

      .error-message {
        font-size: 16px;
        color: #94a3b8;
        max-width: 400px;
        line-height: 1.6;
      }

      .error-button {
        margin-top: 24px;
        padding: 12px 24px;
        background: #6366f1;
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
      }

      .error-button:hover {
        background: #4f46e5;
      }

      /* No-JS fallback content */
      .no-js-content {
        display: none;
        text-align: center;
        padding: 24px;
        max-width: 600px;
        margin: 0 auto;
      }

      noscript .no-js-content {
        display: block;
      }
    </style>

    <!-- Preload critical resources -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <!-- Loading screen (shown immediately, hidden when React is ready) -->
    <div id="loading-screen" class="loading-screen">
      <div class="loading-logo">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
        </svg>
      </div>
      <p class="loading-text">Chargement de ConvertiFast...</p>
      <div class="loading-spinner"></div>
    </div>

    <!-- Error screen (shown only if JavaScript fails) -->
    <div id="error-screen" class="error-screen">
      <svg class="error-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
      <h1 class="error-title">Oups ! Une erreur s'est produite</h1>
      <p id="error-message" class="error-message">
        Le site n'a pas pu se charger correctement. Essayez de rafraichir la page.
      </p>
      <button class="error-button" onclick="location.reload()">Reessayer</button>
    </div>

    <!-- React root -->
    <div id="root"></div>

    <!-- No-JS fallback content -->
    <noscript>
      <div class="no-js-content">
        <h1 style="font-size: 28px; font-weight: 700; margin-bottom: 16px; color: #f8fafc;">
          ConvertiFast
        </h1>
        <p style="color: #94a3b8; line-height: 1.6;">
          Ce site necessite JavaScript pour fonctionner. Veuillez activer JavaScript dans votre navigateur pour utiliser les convertisseurs.
        </p>
      </div>
    </noscript>

    <!-- Error handler script -->
    <script>
      // Global error handler
      window.onerror = function(message, source, lineno, colno, error) {
        console.error('Global error:', message, source, lineno, colno, error);
        showError(message);
        return true;
      };

      // Unhandled promise rejection handler
      window.onunhandledrejection = function(event) {
        console.error('Unhandled promise rejection:', event.reason);
        showError('Une erreur inattendue s\'est produite');
      };

      // Show error screen
      function showError(message) {
        var loadingScreen = document.getElementById('loading-screen');
        var errorScreen = document.getElementById('error-screen');
        var errorMessage = document.getElementById('error-message');

        if (loadingScreen) {
          loadingScreen.classList.add('hidden');
        }
        if (errorScreen) {
          errorScreen.classList.add('visible');
        }
        if (errorMessage && message) {
          // Sanitize message to prevent XSS
          errorMessage.textContent = message;
        }
      }

      // Hide loading screen when React is ready
      window.hideLoadingScreen = function() {
        var loadingScreen = document.getElementById('loading-screen');
        if (loadingScreen) {
          loadingScreen.classList.add('hidden');
          // Remove from DOM after animation
          setTimeout(function() {
            if (loadingScreen && loadingScreen.parentNode) {
              loadingScreen.parentNode.removeChild(loadingScreen);
            }
          }, 300);
        }
      };
    </script>

    <!-- Main application script -->
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
